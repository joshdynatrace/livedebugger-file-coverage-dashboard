site_name: "Live Debugger File Coverage Dashboard"
repo_name: "View Code on GitHub"
repo_url: "https://github.com/joshDynatrace/livedebugger-file-coverage-dashboard"
nav:
  - '1. About': index.md
  - '2. Codespaces': codespaces.md
  - '3. Setting up Coverage Data': setting-up-coverage-data.md
  - '4. Building the Dashboard': building-dashboard.md
  - "5. What's Next": whats-next.md
theme:
  name: material
  custom_dir: docs/overrides
  features:
    - content.code.copy

  palette:
  # Palette toggle for automatic mode
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode

  # Palette toggle for light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: deep-purple
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode

  # Palette toggle for dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: deep-purple
    toggle:
      icon: material/brightness-4
      name: Switch to system preference

markdown_extensions:
  - toc:
      permalink: '#'
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["docs"]
  - attr_list
plugins:
    - search
extra_css:
  - overrides/assets/stylesheets/extra.css
